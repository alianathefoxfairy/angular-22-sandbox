<div class="rounded-2xl bg-white p-6 shadow-xl ring-1 ring-gray-100">
    <div class="space-y-3">
        <div>
            <h2 class="text-xl font-bold text-gray-800">
                Child Component
            </h2>
            <p class="text-sm text-purple-600">Receiving data</p>
        </div>
        
        <div class="rounded-xl bg-purple-50 p-4">
            <p class="text-sm text-purple-500">Username Received</p>
            <p class="mt-1 text-xl font-bold text-purple-700">
                {{userName()}}
            </p>
        </div>
        <div class="grid md:grid-cols-2 rounded-xl bg-pink-50 ">
            <div class="p-4">
                <p class="text-sm text-pink-500">Quantity Received</p>
                <p class="mt-1 text-xl font-bold text-pink-700">
                    {{quantityValue()}}
                </p>
            </div>

            <div class="p-5">
                <div class="flex gap-3 justify-center ml-12">
                    <button (click)="increase()" class="rounded-lg bg-green-500 px-5 py-3 font-bold text-white hover:bg-green-700">
                        +1 
                    </button>
                    <button (click)="decrease()" class="rounded-lg bg-red-500 px-5 py-3 font-bold text-white hover:bg-red-700">
                        -1
                    </button>
                </div>
            </div>
        </div>
        
        <!--<button (click)="increaseQuantity()" class="rounded-lg bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-700">
            +1 Parent Quantity
        </button>-->

        <p class="mt-4 p-2">
            Example of viewChild(): <b class="text-pink-700">{{message()}}</b>
        </p>
    </div>
</div>
