<div class="text">
    <h3>1. Interpolation</h3>
    <p>{{name}}</p>

    <h3>2. Property Binding</h3>
    <input type="text" [value]="topic">
    <div class="h-50 w-50 border border-black p-2">
        <img [src]="image" alt="House" class="w-full h-full object-cover">
    </div>

    <h3>3. Event Binding</h3>
    <div>
        <button class="test-white text-sm bg-blue-500 rounded px-2 cursor-pointer"
        (click)="onSubmitClick()">Submit</button>
    </div>

    <div class="p-2">
        <select class="w-50 bg-gray-400 text-white text-sm cursor-pointer" 
        (change)="onCountryChange()">
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Spain">Spain</option>
        </select>
    </div>

    <h3>4. Two-Way Binding - ngModel</h3>
    <div class="p-2">
        <input type="text" [(ngModel)]="name">
        <p>{{name}}</p>
    </div>
</div>
